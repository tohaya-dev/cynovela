<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 680" width="1020" height="680" font-family="Helvetica Neue, Helvetica, Arial, Hiragino Sans, Hiragino Kaku Gothic ProN, Yu Gothic, Meiryo, Noto Sans CJK JP, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8c959f"/></marker></defs>
<rect width="1020" height="680" fill="#ffffff"/>
<text x="510.0" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2328">Cynovela chewie — Architecture Overview / 構成の概要</text>
<text x="510.0" y="49" text-anchor="middle" font-size="11" fill="#57606a">All processing runs on the local machine. / すべての処理は手元の機械の中で完結します。</text>
<rect x="30" y="62" width="960" height="84" rx="8" fill="#eef4fb" stroke="#adc6e5" stroke-width="1.2"/>
<text x="44" y="82" font-size="12.5" font-weight="700" fill="#57606a">1. Entry points / 入口</text>
<rect x="50" y="88" width="280" height="44" rx="6" fill="#ffffff" stroke="#adc6e5" stroke-width="1.2"/>
<text x="190.0" y="106.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Browser UI</text>
<text x="190.0" y="123.0" text-anchor="middle" font-size="12" fill="#1f2328">ブラウザ画面</text>
<rect x="370" y="88" width="280" height="44" rx="6" fill="#ffffff" stroke="#adc6e5" stroke-width="1.2"/>
<text x="510.0" y="106.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">CLI  (cynovela-cli.py)</text>
<text x="510.0" y="123.0" text-anchor="middle" font-size="12" fill="#1f2328">コマンド</text>
<rect x="690" y="88" width="280" height="44" rx="6" fill="#ffffff" stroke="#adc6e5" stroke-width="1.2"/>
<text x="830.0" y="106.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">MCP server  (mcp_server.py)</text>
<text x="830.0" y="123.0" text-anchor="middle" font-size="12" fill="#1f2328">MCP サーバー</text>
<line x1="510" y1="150" x2="510" y2="168" stroke="#8c959f" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="30" y="172" width="960" height="84" rx="8" fill="#eef7f0" stroke="#a8ceb4" stroke-width="1.2"/>
<text x="44" y="192" font-size="12.5" font-weight="700" fill="#57606a">2. Application  FastAPI / アプリ本体</text>
<rect x="50" y="198" width="280" height="44" rx="6" fill="#ffffff" stroke="#a8ceb4" stroke-width="1.2"/>
<text x="190.0" y="216.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Routers (35)</text>
<text x="190.0" y="233.0" text-anchor="middle" font-size="12" fill="#1f2328">API の入口</text>
<rect x="370" y="198" width="280" height="44" rx="6" fill="#ffffff" stroke="#a8ceb4" stroke-width="1.2"/>
<text x="510.0" y="216.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Auth / RBAC  3 roles</text>
<text x="510.0" y="233.0" text-anchor="middle" font-size="12" fill="#1f2328">認証と権限  3 ロール</text>
<rect x="690" y="198" width="280" height="44" rx="6" fill="#ffffff" stroke="#a8ceb4" stroke-width="1.2"/>
<text x="830.0" y="216.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Audit log</text>
<text x="830.0" y="233.0" text-anchor="middle" font-size="12" fill="#1f2328">監査ログ</text>
