# fixall-B2 20260602: 公式ビルド手順は launch.sh の2段構成。
#   (1) conda env create -f environment.yml   ← conda層 + 下記 pip: 凍結スナップショット
#   (2) pip install -r requirements.txt        ← pip層の正本マニフェスト
# 文書抽出系 (pdfplumber / pypdfium2) と推移依存 (numba/llvmlite/tiktoken 等) は
# requirements.txt 側でのみ宣言し、本 environment.yml の凍結 pin には含めない (numpy 等との解決衝突回避)。
# 別Macでは launch.sh が両段を自動実行するため「ディレクトリ複製 + conda」で自己完結する。
